<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
  <title>비밀번호 재설정 인증 코드</title>
</head>
<body style="margin:0;padding:0;width:100%;background-color:#f4f6fa;-webkit-text-size-adjust:100%;">
  <div style="display:none;font-size:1px;line-height:1px;color:#f4f6fa;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">앱에서 인증 코드를 입력하고 새 비밀번호를 설정해 주세요.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f6fa" style="width:100%;background-color:#f4f6fa;">
    <tr><td align="center" style="padding:32px 16px;">
      <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:560px;background-color:#ffffff;border:1px solid #e3e8ef;border-radius:20px;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
        <tr><td style="padding:36px 24px 0;">
          <!-- Text wordmark: replace this paragraph with your hosted logo image if required. -->
          <p style="margin:0;color:#2168d6;font-size:24px;line-height:32px;font-weight:800;">{{service_name}}</p>
        </td></tr>
        <tr><td style="padding:32px 24px 0;">
          <h1 style="margin:0;color:#17243c;font-size:26px;line-height:38px;font-weight:700;word-break:keep-all;">비밀번호 재설정<br>인증 코드 안내</h1>
          <p style="margin:20px 0 0;color:#49566c;font-size:16px;line-height:27px;word-break:keep-all;">비밀번호 재설정을 위한 인증 코드입니다.<br>앱으로 돌아가 아래 6자리 코드를 입력해 주세요.</p>
        </td></tr>
        <tr><td style="padding:28px 24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef4ff" style="width:100%;background-color:#eef4ff;border:1px solid #dce8ff;border-radius:12px;">
            <tr><td align="center" style="padding:20px 8px 8px;color:#526580;font-size:13px;line-height:20px;">인증 코드</td></tr>
            <tr><td align="center" style="padding:0 8px 24px;color:#174ea6;font-family:'Courier New',monospace;font-size:36px;line-height:46px;font-weight:700;letter-spacing:5px;white-space:nowrap;">{{verification_code}}</td></tr>
          </table>
        </td></tr>
        <tr><td style="padding:0 24px 32px;">
          <p style="margin:0;padding-top:22px;border-top:1px solid #e3e8ef;color:#667085;font-size:13px;line-height:22px;word-break:keep-all;">직접 요청하지 않으셨다면 이 메일을 무시해 주세요.<br>인증 코드는 다른 사람에게 알려주지 마세요.</p>
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
